# example netlify.toml
[build]
  command = "hugo"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.168.0"

[[redirects]]
  from = "/changelog"
  to = "/whats-new"
  status = 301

[[redirects]]
  from = "/es/changelog"
  to = "/es/whats-new"
  status = 301

[[redirects]]
  from = "/it/changelog"
  to = "/it/whats-new"
  status = 301

[[redirects]]
  from = "/zh/changelog"
  to = "/zh/whats-new"
  status = 301

[[redirects]]
  from = "/ja/changelog"
  to = "/ja/whats-new"
  status = 301

[[redirects]]
  from = "/tags/"
  to = "/"
  status = 301

[[redirects]]
  from = "/es/tags/"
  to = "/es/"
  status = 301

[[redirects]]
  from = "/it/tags/"
  to = "/it/"
  status = 301

[[redirects]]
  from = "/zh/tags/"
  to = "/zh/"
  status = 301

[[redirects]]
  from = "/ja/tags/"
  to = "/ja/"
  status = 301

[[redirects]]
  from = "/categories/"
  to = "/"
  status = 301

[[redirects]]
  from = "/es/categories/"
  to = "/es/"
  status = 301

[[redirects]]
  from = "/it/categories/"
  to = "/it/"
  status = 301

[[redirects]]
  from = "/zh/categories/"
  to = "/zh/"
  status = 301

[[redirects]]
  from = "/ja/categories/"
  to = "/ja/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Link = "</llms.txt>; rel=\"alternate\"; type=\"text/markdown\""

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sass/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
