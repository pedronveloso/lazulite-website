# example netlify.toml
[build]
  command = "hugo"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.166.0"

[[headers]]
  for = "/*"
  [headers.values]
    Link = "</llms.txt>; rel=\"alternate\"; type=\"text/markdown\""

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sass/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
