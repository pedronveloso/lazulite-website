{{ if hugo.IsProduction }}
{{/* Google tag: keep consent denied before config for cookieless measurement. */}}
<script>
  (function () {
    if (window.location.hostname !== 'lazulite.app' && window.location.hostname !== 'www.lazulite.app') {
      return;
    }

    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };

    window.gtag('consent', 'default', {
      ad_storage: 'denied',
      analytics_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });
    window.gtag('set', 'ads_data_redaction', true);
    window.gtag('js', new Date());
    window.gtag('config', 'AW-18521711197');

    var tag = document.createElement('script');
    tag.async = true;
    tag.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18521711197';
    document.head.appendChild(tag);
  }());
</script>
{{ end }}
