baseURL = 'https://lazulite.app'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = 'Lazulite App'
theme = "lazulite"

# Allow raw HTML in markdown
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Serve a plain-markdown alternate of content pages (FAQ, Privacy) for AI agents
[outputs]
  page = ["HTML", "MARKDOWN"]

[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats]
  [outputFormats.MARKDOWN]
    mediaType = "text/markdown"
    isPlainText = true
    isHTML = false
    permalinkable = false

[[params.social]]
key = 0
name = "email"
url = "mailto:lazuliteapp@gmail.com"
#icon = "fa-solid fa-envelope"

[params]
readingTime = false  # Show reading time on post page
published = false  # Show published data on post page
playStoreUrl = "https://play.google.com/store/apps/details?id=com.pedronveloso.lazulite"
socialImage = "/images/opengraph/lazulite.png"
socialImageWidth = 1200
socialImageHeight = 630

[languages]
  [languages.en]
    locale = 'en-US'
    label = 'English'
    weight = 1
    title = 'Lazulite App'
    [languages.en.params]
      footerHtml = 'Lazulite App for Android'
      description = "Real-time Bluetooth audio codec inspection for Android. Monitor LDAC, aptX HD, AAC, SBC and more — see exactly what your wireless audio is doing."
      homeTitle = "Bluetooth Audio Inspector for Android | Lazulite App"
    [[languages.en.menu.header]]
      name = "Privacy Policy"
      weight = 0
      pageRef = "/privacy"
    [[languages.en.menu.header]]
      name = "FAQ"
      weight = 1
      pageRef = "/faq"
    [[languages.en.menu.header]]
      name = "What's New"
      weight = 2
      pageRef = "/whats-new"

  [languages.es]
    locale = 'es-ES'
    label = 'Español'
    weight = 2
    title = 'Lazulite App'
    [languages.es.params]
      footerHtml = 'Lazulite App para Android'
      description = "Inspección en tiempo real de códecs de audio Bluetooth para Android. Supervisa LDAC, aptX HD, AAC, SBC y más para ver exactamente qué está haciendo tu audio inalámbrico."
      homeTitle = "Inspector de audio Bluetooth para Android | Lazulite App"
    [[languages.es.menu.header]]
      name = "Privacidad"
      weight = 0
